# @package _group_
instruction: "Pick up the stuffed animal and place it in the cardboard box."
# instruction: "Pick up the stuffed animal and place it in the box. Control mode: joint velocity."

home_pos: [0.30582778, 0., 0.48467681]
home_rot: [1., 0., 0., 0.]
home_q: [0.002532, -0.542530, -0.002353, -2.448671, -0.000952, 1.903067, 0.010804]

# Randomize the start posture: per-reset Gaussian noise (radians) added to each
# joint of home_q. Flip enabled to true to use it; tune per-joint stddevs here.
home_q_noise_enabled: true
home_q_noise_std: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02]

pos_mask: [true, true, true]

freeze_rotation: false
freeze_gripper: false
zero_gripper_obs: false  # Zero out gripper obs (matches old collection data)
open_gripper_on_reset: true
gripper_hysteresis: 0.1  # Dead zone: grasp if > 0.5+h, open if < 0.5-h
gripper_logging: false

controller: joint_impedance
action_type: qpos

# controller: cartesiand place it in the box. Control mode: joint velocity."
# action_type: cartesian

max_episode_timesteps: 225

impedance:
  # Original panda_py CartesianImpedance defaults, converted to explici0t gains.
  translational_stiffness: [300, 300, 300]       # N/m
  rotational_stiffness: [60, 60, 60]             # Nm/rad
  translational_damping: [40, 40, 40]            # N·s/m    (2*sqrt(400) = 40)
  rotational_damping: [8, 8, 8]      #'' Nm·s/rad (2*sqrt(60) ≈ 15.49)
  nullspace_stiffness: [5, 5, 5, 5, 5, 5, 5]  # Nm/rad
  nullspace_damping: [7.75, 7.75, 7.75, 7.75, 7.75, 7.75, 7.75]  # Nm·s/rad (2*sqrt(15) ≈ 7.75)
  # Per-joint gains for the joint_impedance (libfranka JointPosition) controller.
  # Ordered joint 1 (base) -> joint 7 (wrist). Only used when controller:
  # joint_impedance; ignored by cartesian/hybrid_joint. Lower stiffness = softer
  # / more compliant. Keep damping near 2*sqrt(stiffness) to avoid oscillation.
  joint_stiffness: [600, 600, 600, 600, 250, 150, 50]   # Nm/rad   (panda_py stock defaults)
  joint_damping:   [50, 50, 50, 20, 20, 20, 10]          # Nm·s/rad