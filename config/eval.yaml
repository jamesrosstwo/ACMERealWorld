defaults:
  - policy: borabora
  - task: rope

policy:
  prompt: ${task.instruction}
  action_type: ${task.action_type}

max_episode_timesteps: 2000
start_index: 0

# Print each commanded action horizon (pre-safety) to stdout. Useful for
# debugging policy output when the safety check is rejecting horizons.
print_action: false

# Save per-camera MP4s + first-frame PNGs of the eval episode under
# <episode_dir>/dataset_renders/, matching the training dataset_renders layout
# (output_video_<idx>.mp4, first_frame_<idx>.png with idx in obs_cams order).
render_eval: true

# Hard caps on commanded motion. If the policy emits a horizon whose implied
# velocity exceeds either limit, the eval script aborts before the command is
# sent to the robot. Redundant with libfranka's own limits — disable if those
# are sufficient for your setup.
safety:
  enabled: true
  max_linear_velocity: 0.9    # m/s
  max_angular_velocity: 2.5   # rad/s

# After dispatching each policy horizon, block before the next inference
# until the measured EE position is within `threshold_mm` of the commanded
# final pose (or `timeout_s` elapses). Replaces a fixed post-horizon sleep
# so the policy never sees an observation while the robot is still catching
# up to the previous horizon's target.
settle:
  threshold_mm: 4.0
  timeout_s: 0.6
  poll_period_s: 0.005



writer:
  max_episode_len: ${max_episode_timesteps}

nuc:
  ip: "192.168.1.106"
  franka_ip: "192.168.1.107"
  home_pos: ${task.home_pos}
  home_rot: ${task.home_rot}
  home_q: ${task.home_q}
  # Per-reset Gaussian noise on the joint-space home (see config/task/default.yaml).
  home_q_noise_enabled: ${oc.select:task.home_q_noise_enabled,false}
  home_q_noise_std: ${oc.select:task.home_q_noise_std,0.0}
  server:
    controller: ${task.controller}
    gripper_hysteresis: ${task.gripper_hysteresis}
    gripper_logging: ${task.gripper_logging}
    impedance: ${task.impedance}
    # Gripper backend. "robotiq" drives a Robotiq 2F-85 over USB->RS485 (Modbus
    # RTU) on the control PC, independent of the Franka. "panda" uses the Franka
    # Panda Hand through the control box at franka_ip. The franka_ip above is
    # ignored by the robotiq backend.
    gripper:
      type: robotiq          # "robotiq" or "panda"
      # Prefer a stable /dev/serial/by-id/... symlink so the USB->RS485 FTDI
      # can't get swapped with the GELLO FTDI; "auto" probes for any Robotiq.
      port: "auto"
      device_id: 9           # Robotiq Modbus slave id (default 9)
      speed: 255             # 0-255
      force: 100             # 0-255 — start gentle, tune up
      max_width_m: 0.085     # 2F-85 stroke (m), used for obs scaling

# Mixed-backend eval camera set (consumed by client.eval.cameras.EvalCameras).
# RealSense everywhere, ZED (droid-style) for the wrist. Shared width/height/fps
# apply to both backends; laser_power is RealSense-only (ignored by ZED).
cameras:
  n_frames: ${max_episode_timesteps}
  obs_history: ${policy.obs_history}
  width: 1280
  height: 720
  fps: 15
  # Must match the value used during collection (config/collect.yaml). The D4x5
  # IR projector pattern bleeds into the color stream, so a mismatch here
  # introduces a training/eval visual shift.
  laser_power: 0
  # Maps each policy-server rgb key -> the physical camera that fills it. The KEY
  # is sent to the server verbatim (as the multipart file field and in the
  # rgb_keys form value) and is what the policy's rgb_keys is derived from, so it
  # must be the server's canonical DROID key WITHOUT the `observation/` prefix
  # (exterior_image_1_left, exterior_image_2_left, wrist_image_left). The server
  # re-namespaces them internally; see `GET /conventions` (input.rgb_keys) for
  # the authoritative list. This is the single source of truth for the
  # cam->server mapping — there is no positional rgb_0/rgb_1 remap anymore.
  #
  # The VALUE is the camera: a bare string is a RealSense hardware serial; a
  # mapping selects another backend. For a ZED, `serial` is just a stable label
  # (not its hw serial) and `zed_serial` pins a device when more than one is
  # connected. Order is preserved and also drives writer/render output indices.
  obs_cams:
    exterior_image_1_left: "148122060186"   # high right (RealSense)
    exterior_image_2_left: "932122060415"   # high left  (RealSense)
    wrist_image_left:                        # wrist — ZED Mini (droid-style)
      serial: "wrist_zed"
      backend: zed
      zed_serial: 17785901   # ZED Mini hw serial — pinned (two ZEDs connected)
    

# OopsieData failure-mode logging. Disabled by default; enable once
# oopsie-tools/configs/contributor_config.yaml has a real lab_id (UofT_RVL).
# The oopsie profile (acme_franka.yaml) logs two cameras, "external" and
# "wrist". They are selected from cameras.obs_cams by server key:
# exterior_image_1_left -> "external", wrist_image_left -> "wrist"
# (see client/eval/__main__.py). exterior_image_2_left is not logged.
oopsie:
  enabled: true
  robot_profile: oopsie-tools/configs/robot_profiles/acme_franka.yaml
  data_root_dir: ../outputs/oopsie
  operator_name: ""

hydra:
  output_subdir: null
  run:
    dir: .