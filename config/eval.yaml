defaults:
  - policy: borabora
  - task: rope

policy:
  prompt: ${task.instruction}
  action_type: ${task.action_type}

max_episode_timesteps: 4000
start_index: 0

# Print each commanded action horizon (pre-safety) to stdout. Useful for
# debugging policy output when the safety check is rejecting horizons.
print_action: false

# Save per-camera MP4s + first-frame PNGs of the eval episode under
# <episode_dir>/dataset_renders/, matching the training dataset_renders layout
# (output_video_<idx>.mp4, first_frame_<idx>.png with idx in obs_cams order).
render_eval: true

# Hard caps on commanded motion. If the policy emits a horizon whose implied
# velocity exceeds either limit, the eval script aborts before the command is
# sent to the robot. Redundant with libfranka's own limits — disable if those
# are sufficient for your setup.
safety:
  enabled: false
  max_linear_velocity: 0.9    # m/s
  max_angular_velocity: 2.5   # rad/s

# After dispatching each policy horizon, block before the next inference
# until the measured EE position is within `threshold_mm` of the commanded
# final pose (or `timeout_s` elapses). Replaces a fixed post-horizon sleep
# so the policy never sees an observation while the robot is still catching
# up to the previous horizon's target.
settle:
  threshold_mm: 4.0
  timeout_s: 0.6
  poll_period_s: 0.005



writer:
  max_episode_len: ${max_episode_timesteps}

nuc:
  ip: "192.168.1.106"
  franka_ip: "192.168.1.107"
  home_pos: ${task.home_pos}
  home_rot: ${task.home_rot}
  server:
    controller: ${task.controller}
    gripper_hysteresis: ${task.gripper_hysteresis}
    gripper_logging: ${task.gripper_logging}
    impedance: ${task.impedance}

realsense:
  n_frames: ${max_episode_timesteps}
  obs_history: ${policy.obs_history}
  width: 1280
  height: 720
  fps: 15
  # Must match the value used during collection (config/collect.yaml). The D4x5
  # IR projector pattern bleeds into the color stream, so a mismatch here
  # introduces a training/eval visual shift.
  laser_power: 0
  obs_cams:
    # - "102122061570" # aug right
    # - "148122060186" # high rights
    - "932122060415" # high left
    # - "848312071702" # overhead
    # - "051222062898" # aug left
    - "217222061106" # wrist cam

hydra:
  output_subdir: null
  run:
    dir: .