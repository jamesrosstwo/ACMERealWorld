control_frequency: 0.4
obs_history: 2
action_horizon: 24
action_start_offset: 2
# rgb_keys come from cameras.obs_cams (the cam -> server-key mapping); see
# config/eval.yaml. Setting rgb_keys here is ignored.
lowdim_keys: ["eef_pos", "eef_quat", "gripper_force"]
delta_actions: false
host: localhost
# Don't forget to tunnel and point the eval config to this one
# ssh -L 54455:localhost:54455 tisl-robotics
# Then, select the task (i.e. /home/rvl_root/Desktop/ACMERealWorldTesting/ACMERealWorld/config/task/pickandplace_deformable.yaml)
# , then ctrl shift p, run task, eval
port: 54455
prompt: ""
frame_shape:
  - 3
  - 224
  - 224
# Frame preprocessing — openpi/π0-style by default.
antialias: true
resize_with_pad: true
